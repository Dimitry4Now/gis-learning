<div #map class="map"></div>

<aside class="panel">
  <app-place-search (selected)="flyToPlace($event)" (cleared)="clearPlace()" />

  <app-layer-panel
    [basemaps]="basemaps"
    (basemapChange)="store.setBasemap($event)"
    [summaries]="summaries()"
    [sources]="sources()"
    [config]="store.config()"
    [statuses]="statuses()"
    [failed]="registryFailed()"
    (visibleChange)="store.setVisible($event.id, $event.visible)"
    (opacityChange)="store.setOpacity($event.id, $event.opacity)"
    (move)="store.move($event.id, $event.delta)"
    (forget)="store.forget($event)"
    (retry)="loadRegistry()"
  />
</aside>
