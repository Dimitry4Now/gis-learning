services:
  db:
    image: postgis/postgis:17-3.5
    container_name: gis-postgis
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
    # 5432 and 5433 are taken by other local projects
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
